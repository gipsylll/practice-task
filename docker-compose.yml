services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 10s
      timeout: 3s
      retries: 3
